services:
  mysql:
    image: mysql:8.4
    container_name: safevault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: safevault
      MYSQL_USER: safevault
      MYSQL_PASSWORD: safevault_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
